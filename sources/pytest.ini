# Service-free config for the warehouse source plugins: no Django, no database, no services.
# Run it from the repo root: pytest -c sources/pytest.ini --confcutdir=sources sources/
# --confcutdir keeps the root conftest.py (Django) out. sources/__init__.py makes pytest put the
# repo root, not sources/, on sys.path, so a vendor directory never shadows an installed package.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = .
addopts = -p no:django -p no:warnings
